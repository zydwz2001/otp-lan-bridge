<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>验证码传递 · 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="page">
    <header class="header">
      <div><h1>验证码传递</h1><p>连接手机后，即可在网页中填写短信验证码。</p></div>
      <div class="connection">
        <span id="status-dot" class="status-dot"></span>
        <div><strong id="connection-status">正在读取状态</strong><small id="notification-status"></small></div>
      </div>
    </header>

    <section class="card">
      <div class="heading"><span>1</span><div><h2>连接手机</h2><p>手机和电脑连接同一个 Wi-Fi，然后填写手机 App 显示的信息。</p></div></div>
      <div class="pair-grid">
        <label>手机地址<input id="host" inputmode="decimal" placeholder="请输入手机显示的地址" autocomplete="off"></label>
        <label>端口<input id="port" type="number" min="1024" max="65535" placeholder="请输入 App 显示的端口"></label>
        <label>6 位配对码<input id="pair-code" class="code-input" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code"></label>
      </div>
      <div class="actions">
        <button id="pair" class="primary">配对手机</button>
        <button id="reconnect" class="secondary">连接当前手机</button>
        <button id="unpair" class="danger">更换手机</button>
      </div>
      <p id="pair-feedback" class="inline-feedback" role="status"></p>
    </section>

    <section class="card">
      <div class="heading"><span>2</span><div><h2>保存手机号</h2><p>用于网页中的手机号输入框，页面上只显示脱敏号码。</p></div></div>
      <div class="phone-row">
        <label>常用手机号<input id="phone" type="tel" placeholder="13800000000" autocomplete="off"></label>
        <label class="check"><input id="sound" type="checkbox" checked><span>收到验证码时播放提示音</span></label>
      </div>
    </section>

    <details class="card advanced">
      <summary>网站显示范围 <span>可选设置</span></summary>
      <div class="advanced-body">
        <p>允许列表留空时在所有普通网页显示；排除列表优先。</p>
        <div class="domain-grid">
          <label>只允许这些域名<textarea id="allowed" rows="5" placeholder="example.com"></textarea></label>
          <label>不在这些域名显示<textarea id="excluded" rows="5" placeholder="bank.example.com"></textarea></label>
        </div>
      </div>
    </details>

    <div class="save-row"><button id="save" class="primary large">保存设置</button><span id="feedback" role="status"></span></div>
    <footer>插件不会点击发送验证码；填写验证码后，只在能明确识别同一表单的登录按钮时继续提交。</footer>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
