name: CI

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build Android app
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: verification-code-transfer-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  chrome-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Build Verification Code Transfer
        working-directory: extension
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Package Chrome extension
        run: |
          cd extension/dist
          zip -r ../../verification-code-transfer-chrome.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: verification-code-transfer-chrome
          path: verification-code-transfer-chrome.zip
