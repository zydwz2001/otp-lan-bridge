name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Build Android app
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Build Chrome extension
        working-directory: extension
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - name: Package downloads
        run: |
          mkdir release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/verification-code-transfer-android.apk
          cd extension/dist
          zip -r ../../release/verification-code-transfer-chrome.zip .
          cd ../../release
          sha256sum verification-code-transfer-android.apk verification-code-transfer-chrome.zip > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" release/*
          --title "验证码传递 ${GITHUB_REF_NAME}"
          --generate-notes
